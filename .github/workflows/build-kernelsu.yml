name: 🔥 Build KernelSU for evergo (GCC)
run-name: KernelSU ${{ inputs.kernelsu_version }} for evergo

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU版本'
        required: true
        default: 'v1.0.2'
        type: string

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        run: |
          git clone --depth=1 --branch R https://github.com/${{ github.repository }} kernel
          echo "✅ kernel cloned"

      - name: Checkout KernelSU
        run: |
          git clone --depth=1 --branch ${{ inputs.kernelsu_version }} https://github.com/tiann/KernelSU kernel/KernelSU
          echo "✅ KernelSU cloned"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            flex bison libncurses5-dev libssl-dev libelf-dev \
            bc cpio kmod rsync unzip zip ccache python3 \
            gcc-aarch64-linux-gnu

      - name: Integrate KernelSU
        run: |
          cd kernel
          echo "obj-y += KernelSU/" >> Makefile
          # 为MTK 4.14内核启用KPROBES
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/evergo_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/evergo_defconfig
          echo "✅ KernelSU integrated (kprobes enabled)"

      - name: Configure kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- evergo_defconfig
          echo "✅ defconfig done"

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log
          echo "✅ Build complete!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: evergo-kernelsu-boot-v${{ inputs.kernelsu_version }}
          path: |
            kernel/out/arch/arm64/boot/
          if-no-files-found: warn
