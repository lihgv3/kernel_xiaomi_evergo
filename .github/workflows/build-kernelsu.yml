name: 🔥 Build KernelSU for Redmi Note 11 5G (evergo)
run-name: KernelSU ${{ inputs.kernelsu_version }} for evergo

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU版本'
        required: true
        default: 'v1.0.2'
        type: string

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        run: |
          git clone --depth=1 --branch R https://github.com/${{ github.repository }} kernel
          echo "✅ kernel cloned"

      - name: Checkout KernelSU
        run: |
          git clone --depth=1 --branch ${{ inputs.kernelsu_version }} https://github.com/tiann/KernelSU kernel/KernelSU
          echo "✅ KernelSU cloned"

      - name: Install all dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            git ccache python3 flex bison libncurses5-dev \
            libssl-dev libelf-dev bc cpio kmod rsync unzip zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang-14 lld-14 llvm-14

      - name: Integrate KernelSU
        run: |
          cd kernel
          echo "obj-y += KernelSU/" >> Makefile
          [ -f KernelSU/kernel/setup.sh ] && cd KernelSU/kernel && chmod +x setup.sh && ./setup.sh && cd ../..
          echo "✅ KernelSU integrated"

      - name: Configure kernel
        run: |
          cd kernel
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- evergo_defconfig
          echo "✅ evergo_defconfig done"

      - name: Build kernel
        run: |
          cd kernel
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log
          echo "✅ Build complete!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evergo-kernelsu-boot-${{ inputs.kernelsu_version }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/build.log
          if-no-files-found: warn
