name: Build KernelSU
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison libncurses5-dev libssl-dev libelf-dev bc cpio kmod

      - name: KernelSU + Fix all bugs
        run: |
          git clone --depth=1 https://github.com/tiann/KernelSU
          echo "obj-y += KernelSU/" >> Makefile
          sed -i 's/CONFIG_BLK_INLINE_ENCRYPTION=y/# CONFIG_BLK_INLINE_ENCRYPTION is not set/' arch/arm64/configs/evergo_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/evergo_defconfig

          # fpc1542 VLA
          sed -i 's/u8 rx\[len\] = {0, 0, 0};/u8 rx[len]; memset(rx, 0, len);/' drivers/input/fingerprint/fpc1542/mtk_spi.c
          sed -i 's/u8 tx\[len\] = {0xfc, 0, 0};/u8 tx[len]; memset(tx, 0, len); tx[0] = 0xfc;/' drivers/input/fingerprint/fpc1542/mtk_spi.c

          # sia81xx VLA + mixed decl
          find sound/soc/codecs/sia81xx/ -name "*_regs.c" -exec sed -i 's/uint8_t vals\[reg_num\] = {0};/uint8_t vals[reg_num]; memset(vals, 0, reg_num);/' {} \;
          find sound/soc/codecs/sia81xx/ -name "*_regs.c" -exec sed -i 's/uint8_t crc = 0;/uint8_t crc; crc = 0;/' {} \;

          # sia8159 static VLA
          sed -i '/static const char defaults\[reg_num\]/d' sound/soc/codecs/sia81xx/sia8159_regs.c

          # mtk_cm_mgr memset
          sed -i 's/memset(count_ack, 0, ARRAY_SIZE(count_ack));/memset(count_ack, 0, sizeof(count_ack));/' drivers/misc/mediatek/base/power/cm_mgr_v1/mtk_cm_mgr.c
          sed -i 's/memset(max_load, 0, ARRAY_SIZE(count_ack));/memset(max_load, 0, sizeof(max_load));/' drivers/misc/mediatek/base/power/cm_mgr_v1/mtk_cm_mgr.c

          # cmdq_sec_mtee sizeof
          sed -i 's/sizeof(ta_uuid)/sizeof(tee->ta_uuid)/' drivers/misc/mediatek/cmdq/mailbox/cmdq_sec_mtee.c
          sed -i 's/sizeof(wsm_uuid)/sizeof(tee->wsm_uuid)/' drivers/misc/mediatek/cmdq/mailbox/cmdq_sec_mtee.c

          # camera_isp sizeof
          sed -i 's/sizeof("CAM_A")/sizeof(cam)/' drivers/misc/mediatek/cameraisp/src/mt6853/camera_isp.c
          sed -i 's/sizeof("CAM_B")/sizeof(cam)/' drivers/misc/mediatek/cameraisp/src/mt6853/camera_isp.c
          sed -i 's/sizeof("CAM_C")/sizeof(cam)/' drivers/misc/mediatek/cameraisp/src/mt6853/camera_isp.c

          # nt36xxx触控驱动
          sed -i 's/static int32_t nvt_selftest_open_sale()/static int32_t nvt_selftest_open_sale(void)/' drivers/input/touchscreen/NT36672C/nt36xxx_mp_ctrlram.c
          sed -i '/do_gettimeofday(&tv);/d' drivers/input/touchscreen/NT36672C/nt36xxx_mp_ctrlram.c

          echo "✅ all 9 bugs fixed"

      - name: Config
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- evergo_defconfig

      - name: Build
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=format \
                     -Wno-error=tautological-compare \
                     -Wno-error=declaration-after-statement \
                     -Wno-error=stringop-overread \
                     -Wno-error=stringop-overflow \
                     -Wno-error=parentheses \
                     -Wno-error=format-extra-args \
                     -Wno-error=strict-prototypes \
                     -Wno-error=unused-variable \
                     -Wno-error=memset-elt-size \
                     -Wno-error=misleading-indentation \
                     -Wno-error=unused-result \
                     -Wno-error=switch-unreachable \
                     -Wno-error=pointer-to-int-cast \
                     -Wno-error=unused-value" \
            2>&1 | tee build.log
          echo "✅ Build complete"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: evergo-kernelsu
          path: out/arch/arm64/boot/
