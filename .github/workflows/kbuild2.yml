name: Build KernelSU
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison libncurses5-dev libssl-dev libelf-dev bc cpio kmod

      - name: KernelSU + Fix all bugs
        run: |
          git clone --depth=1 https://github.com/tiann/KernelSU
          echo "obj-y += KernelSU/" >> Makefile
          sed -i 's/CONFIG_BLK_INLINE_ENCRYPTION=y/# CONFIG_BLK_INLINE_ENCRYPTION is not set/' arch/arm64/configs/evergo_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/evergo_defconfig

          # Bug 1: fpc1542指纹驱动变长数组
          sed -i 's/u8 rx\[len\] = {0, 0, 0};/u8 rx[len]; memset(rx, 0, len);/' drivers/input/fingerprint/fpc1542/mtk_spi.c
          sed -i 's/u8 tx\[len\] = {0xfc, 0, 0};/u8 tx[len]; memset(tx, 0, len); tx[0] = 0xfc;/' drivers/input/fingerprint/fpc1542/mtk_spi.c

          # Bug 2: sia8152声音驱动混合声明
          sed -i 's/uint8_t crc = 0;/uint8_t crc; crc = 0;/' sound/soc/codecs/sia81xx/sia8152_regs.c

          echo "✅ all bugs fixed"

      - name: Config
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- evergo_defconfig

      - name: Build
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=format -Wno-error=tautological-compare -Wno-error=declaration-after-statement -Wno-error=stringop-overread" \
            2>&1 | tee build.log
          echo "✅ Build complete"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: evergo-kernelsu
          path: out/arch/arm64/boot/
